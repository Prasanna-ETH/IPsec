services:
  - type: web
    name: omega-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: AIR_GAPPED
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://omega-ipsec.vercel.app","http://localhost:5173"]'
